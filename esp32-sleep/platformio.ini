; Firmware for the board's secondary ESP32 (ESP32-U4WDH, 4MB embedded flash). SpeedDial doesn't
; use that chip (it drives the audio DAC and a second encoder input), so this just puts it to sleep.
; Flash it through the USB-C port in the orientation that shows up as a CH340 serial port.
; Waveshare's factory image is in their demo package (Firmware/ESP32-KNOB_ESP32_0.bin) if you want it back.

[env:esp32-sleep]
platform = https://github.com/pioarduino/platform-espressif32/releases/download/55.03.311/platform-espressif32.zip
board = esp32dev
framework = arduino
board_build.flash_mode = dio
