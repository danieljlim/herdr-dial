; Waveshare ESP32-S3-Knob-Touch-LCD-1.8 (ESP32-S3R8: 16MB flash, 8MB octal PSRAM).
; Arduino-ESP32 3.x is required for the QSPI esp_lcd driver, hence the pioarduino platform.

[platformio]
default_envs = knob

[env:knob]
platform = https://github.com/pioarduino/platform-espressif32/releases/download/55.03.311/platform-espressif32.zip
board = esp32-s3-devkitc-1
framework = arduino
board_build.arduino.memory_type = qio_opi
board_build.flash_mode = qio
board_upload.flash_size = 16MB
board_build.partitions = default_16MB.csv
monitor_speed = 115200
lib_deps =
    lvgl/lvgl@8.4.0
    bblanchon/ArduinoJson@7.2.1
build_flags =
    -DBOARD_HAS_PSRAM
    -DARDUINO_USB_MODE=1
    -DARDUINO_USB_CDC_ON_BOOT=1
    -DCORE_DEBUG_LEVEL=0
    -DLV_CONF_INCLUDE_SIMPLE
    -DLV_LVGL_H_INCLUDE_SIMPLE
    -I include

; Same firmware with the power optimisations turned off, for battery-life comparisons.
[env:knob-baseline]
extends = env:knob
build_flags =
    ${env:knob.build_flags}
    -DPOWER_SAVING=0
